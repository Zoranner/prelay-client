name: Release Prelay Client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: prelay-client-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The committed lockfile resolves through the internal Nexus mirror,
          # which hosted runners cannot reach. Rewrite its registry base (host
          # and Nexus repository prefix) in this workspace; package paths,
          # versions and integrity hashes stay intact.
          # @stellar/ui keeps its git.kimo.ink registry from .npmrc.
          sed -i 's#http://pkg\.rd\.kim/repository/npm-group/#https://registry.npmjs.org/#g' bun.lock
          if grep -q 'pkg\.rd\.kim' bun.lock; then
            echo "bun.lock still references the internal npm mirror" >&2
            exit 1
          fi
          bun install --frozen-lockfile

      - name: Typecheck frontend
        shell: bash
        run: bun run typecheck

      - name: Lint frontend
        shell: bash
        run: bun run lint

      - name: Check frontend formatting
        shell: bash
        run: bun run format:check

      - name: Run frontend tests
        shell: bash
        run: bun test

      - name: Verify Rust
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

  prepare:
    name: Prepare Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -er '.version' package.json)"
          native_version="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "prelay-client") | .version')"
          tauri_version="$(jq -er '.version' src-tauri/tauri.conf.json)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "package.json version $package_version does not match tag $tag_version" >&2
            exit 1
          fi
          if [ "$tag_version" != "$native_version" ]; then
            echo "src-tauri/Cargo.toml version $native_version does not match tag $tag_version" >&2
            exit 1
          fi
          if [ "$tag_version" != "$tauri_version" ]; then
            echo "src-tauri/tauri.conf.json version $tauri_version does not match tag $tag_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build desktop client (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            bundles: msi,nsis
            artifact_name: prelay-client-windows-x86_64
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # Linux desktop support is not ready for release yet.
          # - runner: ubuntu-latest
          #   platform: linux-x86_64
          #   bundles: deb,appimage
          #   artifact_name: prelay-client-linux-x86_64
          #   artifact_path: |
          #     src-tauri/target/release/bundle/deb/*.deb
          #     src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      # - name: Install Linux desktop dependencies
      #   if: runner.os == 'Linux'
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       build-essential \
      #       libayatana-appindicator3-dev \
      #       librsvg2-dev \
      #       libssl-dev \
      #       libwebkit2gtk-4.1-dev \
      #       libxdo-dev \
      #       patchelf

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The committed lockfile resolves through the internal Nexus mirror,
          # which hosted runners cannot reach. Rewrite its registry base (host
          # and Nexus repository prefix) in this workspace; package paths,
          # versions and integrity hashes stay intact.
          # @stellar/ui keeps its git.kimo.ink registry from .npmrc.
          sed -i 's#http://pkg\.rd\.kim/repository/npm-group/#https://registry.npmjs.org/#g' bun.lock
          if grep -q 'pkg\.rd\.kim' bun.lock; then
            echo "bun.lock still references the internal npm mirror" >&2
            exit 1
          fi
          bun install --frozen-lockfile

      - name: Build desktop client
        shell: bash
        run: |
          set -euo pipefail
          bun run tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload desktop client artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prelay-client-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Prelay Client ${{ needs.prepare.outputs.version }}
          body: "Desktop packages: Windows MSI and NSIS."
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
